<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lending 績效儀表板</title>
    <link rel="stylesheet" href="/performance.css">
</head>
<body>
<main class="page">
    <section class="hero">
        <p class="eyebrow">Smart Lending</p>
        <h1>放貸績效儀表板</h1>
        <p class="subtitle">用 repo 內保存的主帳戶快照與 Bitfinex v2 ledger 追蹤 fUSD 績效表現。</p>
    </section>

    <section class="toolbar">
        <div class="toolbar-title">主帳戶</div>
        <div class="toolbar-actions">
            <a class="logs-link" href="/logs.html">查看日誌</a>
            <label class="range-picker">
                <span>區間</span>
                <select id="range-select">
                    <option value="7d">7D</option>
                    <option value="30d" selected>30D</option>
                    <option value="90d">90D</option>
                    <option value="all">All</option>
                </select>
            </label>
        </div>
    </section>

    <section class="summary-grid">
        <article class="card">
            <h2>主帳戶</h2>
            <p class="metric-label">TWR 年化</p>
            <p class="metric" id="main-twr">--</p>
            <p class="metric-label">XIRR</p>
            <p class="secondary-metric" id="main-xirr">--</p>
            <p class="detail" id="main-wallet">資產 --</p>
            <p class="warning" id="main-cashflow-warning" hidden></p>
        </article>
    </section>

    <div class="dashboard-grid">
        <section class="chart-panel">
            <div class="chart-header">
                <div>
                    <p class="eyebrow">趨勢</p>
                    <h2 id="chart-title">主帳戶績效</h2>
                </div>
                <div class="chart-stats">
                    <span id="range-return">報酬 --</span>
                    <span id="range-count">點數 --</span>
                    <span id="range-cashflow">現金流 --</span>
                </div>
            </div>
            <div class="chart-wrap">
                <svg id="chart" viewBox="0 0 800 300" preserveAspectRatio="none" aria-label="績效折線圖"></svg>
                <div id="chart-tooltip" class="chart-tooltip" hidden></div>
            </div>
        </section>

        <aside class="adjustment-panel">
            <div class="adjustment-header">
                <div>
                    <p class="eyebrow">本金</p>
                    <h2>Ledger 同步</h2>
                </div>
                <button type="button" class="secondary-button" id="sync-cashflows">同步</button>
            </div>
            <p class="form-status" id="cashflow-status" role="status"></p>
            <div class="cashflow-list-header">
                <h3>最近事件</h3>
                <span id="cashflow-list-count">--</span>
            </div>
            <div class="cashflow-list" id="cashflow-list"></div>
        </aside>
    </div>
</main>
<script src="/performance.js?v=20260618-main-ledger"></script>
</body>
</html>
